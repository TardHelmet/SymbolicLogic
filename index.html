<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Symbolic Logic</title>
  <meta name="description" content="A course in sentential, predicate and non-classical logic in Copi’s notation and rules, with Langer on logical form, and truth tables, proofs and countermodels checked as you work.">
  <link rel="stylesheet" href="./fonts/fonts.css">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./src/ui/app.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="topbar">
    <button type="button" class="menu-btn" id="menu-btn" aria-expanded="false" aria-controls="course-map">Contents</button>
    <a class="brand" href="#/">
      <span class="brand-mark" aria-hidden="true">⊃</span>
      <span class="brand-name">Symbolic Logic</span>
      <span class="brand-sub">after Copi and Langer</span>
    </a>
    <span class="spacer"></span>
    <div class="segmented" role="group" aria-label="Notation">
      <button type="button" id="notation-hurley" aria-pressed="true"><span class="label-long">Hurley</span><span class="glyph" aria-hidden="true">⊃</span></button>
      <button type="button" id="notation-modern" aria-pressed="false"><span class="label-long">Modern</span><span class="glyph" aria-hidden="true">→</span></button>
    </div>
  </header>
  <div class="shell">
    <nav class="course-map" id="course-map" aria-label="Course contents"></nav>
    <main class="page" id="main" tabindex="-1">
      <noscript><p>This course runs in the browser and needs JavaScript. Serve the folder over HTTP (for example with <code>npm start</code>); browsers do not load modules from a file:// URL.</p></noscript>
    </main>
  </div>
</body>
</html>
